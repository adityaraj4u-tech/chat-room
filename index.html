<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chat Room</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'fade-in-up': 'fadeInUp 0.3s ease-out forwards',
            'pulse-soft': 'pulseSoft 1.5s ease-in-out infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            pulseSoft: {
              '0%, 100%': { opacity: '0.6' },
              '50%': { opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    .dark #messages::-webkit-scrollbar-thumb { background: #475569; }
    input, button { font-size: 16px; }
    .emoji-btn:hover { transform: scale(1.25); }
  </style>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-200">

  <div id="name-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="w-full max-w-sm bg-white dark:bg-gray-900 rounded-2xl shadow-2xl p-6 space-y-5">
      <div class="text-center">
        <h2 class="text-xl font-semibold">Chat Room</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Choose how you want to join</p>
      </div>

      <input id="name-input" type="text" maxlength="24" placeholder="Your display name"
        class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
        autocomplete="off" />

      <button id="join-public"
        class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-medium transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <span class="w-2 h-2 rounded-full bg-white/80"></span>
        Join Public Room
      </button>

      <div class="relative flex items-center gap-3">
        <div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
        <span class="text-xs text-gray-400">or</span>
        <div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
      </div>

      <div class="space-y-2">
        <input id="room-input" type="text" maxlength="20" placeholder="Enter private room code"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition uppercase tracking-wider"
          autocomplete="off" />
        <button id="join-private"
          class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium transition disabled:opacity-50 disabled:cursor-not-allowed">
          Join Private Room
        </button>
        <p class="text-xs text-gray-400 text-center">Share the same code with friends to chat privately</p>
      </div>
    </div>
  </div>

  <div class="flex flex-col h-full max-w-2xl mx-auto relative">
    <header class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur sticky top-0 z-20">
      <div class="flex items-center gap-2 min-w-0">
        <h1 class="text-lg font-semibold tracking-tight">Chat Room</h1>
        <span id="room-badge" class="hidden text-[10px] font-mono px-2 py-0.5 rounded-full uppercase tracking-wider"></span>
        <div class="flex items-center gap-1.5 text-xs font-medium text-emerald-600 dark:text-emerald-400">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          Live
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="relative">
          <button id="online-btn" class="flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition text-gray-600 dark:text-gray-300">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            <span id="online-number">0</span>
            <span class="hidden sm:inline">online</span>
            <svg class="w-3.5 h-3.5 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div id="online-dropdown" class="hidden absolute right-0 mt-2 w-56 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl z-30 overflow-hidden">
            <div class="px-3 py-2 border-b border-gray-100 dark:border-gray-800 text-xs font-medium text-gray-500 dark:text-gray-400">People in this room</div>
            <div id="online-list" class="max-h-48 overflow-y-auto py-1">
              <p class="px-3 py-2 text-xs text-gray-400">No one else is here yet</p>
            </div>
          </div>
        </div>
        <button id="share-btn" class="hidden p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 transition text-xs font-medium" title="Share room">Share</button>
        <button id="leave-btn" class="p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/30 text-red-500 transition text-xs font-medium" title="Leave room">Leave</button>
        <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition" aria-label="Toggle dark mode">
          <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </header>

    <div id="messages" class="flex-1 overflow-y-auto px-4 py-4 space-y-3">
      <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center text-gray-400 dark:text-gray-500 py-20">
        <svg class="w-12 h-12 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        <p class="text-sm">No messages yet. Say hello!</p>
      </div>
    </div>

    <div id="typing-indicator" class="hidden px-4 py-1.5 text-xs text-gray-500 dark:text-gray-400 animate-pulse-soft">
      <span id="typing-text"></span>
    </div>

    <div id="emoji-picker" class="hidden absolute bottom-20 left-4 right-4 sm:left-auto sm:right-4 sm:w-72 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-xl p-3 z-30">
      <div class="grid grid-cols-8 gap-1"></div>
    </div>

    <div class="border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
      <form id="message-form" class="flex gap-2 items-end">
        <button type="button" id="emoji-btn" class="p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition text-xl leading-none" title="Emoji">😊</button>
        <input id="message-input" type="text" placeholder="Type a message..." maxlength="500" autocomplete="off"
          class="flex-1 px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition placeholder-gray-400" />
        <button type="submit" id="send-btn" class="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium transition disabled:opacity-50 disabled:cursor-not-allowed">Send</button>
      </form>
      <p id="rate-limit-msg" class="hidden text-xs text-amber-600 dark:text-amber-400 mt-1.5 text-center"></p>
    </div>
  </div>

  <div id="share-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="w-full max-w-sm bg-white dark:bg-gray-900 rounded-2xl shadow-2xl p-6 space-y-4">
      <div class="text-center">
        <h3 class="text-lg font-semibold">Share Private Room</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Anyone with this link can join</p>
      </div>
      <div class="flex gap-2">
        <input id="share-link-input" type="text" readonly
          class="flex-1 px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm focus:outline-none" />
        <button id="copy-link-btn" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium transition">Copy</button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <a id="share-whatsapp" target="_blank" rel="noopener"
          class="flex items-center justify-center gap-2 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-medium transition">
          WhatsApp
        </a>
        <a id="share-telegram" target="_blank" rel="noopener"
          class="flex items-center justify-center gap-2 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-600 text-white text-sm font-medium transition">
          Telegram
        </a>
      </div>
      <button id="close-share" class="w-full py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition">Close</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vwpvbhuqvxmshkktqncp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_zGlQFEHSb-H1KblpZ6AfVQ_Vn8x1ozE';
    const PUBLIC_ROOM = 'PUBLIC';
    const RATE_LIMIT_MS = 1800;
    const MAX_MESSAGE_LENGTH = 500;
    const SPAM_PHRASES = ['http://', 'https://', 'www.', 'buy now', 'click here'];

    let supabaseClient = null;
    let displayName = localStorage.getItem('chatroom_name') || '';
    let roomCode = localStorage.getItem('chatroom_room') || '';
    let messages = [];
    let lastSentAt = 0;
    let presenceChannel = null;
    let messagesChannel = null;
    let onlineUsers = {};
    let typingUsers = new Set();
    let hideTypingTimer = null;

    const EMOJIS = ['😀','😂','🤣','😊','😍','🥰','😘','😜','🤔','😎','😢','😭','😡','🤯','😴','🤗','🙌','👍','👎','👏','🔥','✨','💯','🎉','❤️','💙','💚','💜','🧡','🖤','🚀','🌟','⚡','🍀','🌈','🍕','☕','🎵','📸','💬'];

    function initTheme() {
      const saved = localStorage.getItem('chatroom_theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    }
    document.getElementById('theme-toggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('chatroom_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    });

    const nameModal = document.getElementById('name-modal');
    const nameInput = document.getElementById('name-input');
    const roomInput = document.getElementById('room-input');
    const joinPublic = document.getElementById('join-public');
    const joinPrivate = document.getElementById('join-private');
    const shareBtn = document.getElementById('share-btn');

    function updateButtons() {
      const hasName = nameInput.value.trim().length >= 2;
      joinPublic.disabled = !hasName;
      joinPrivate.disabled = !hasName || roomInput.value.trim().length < 3;
    }
    nameInput.addEventListener('input', updateButtons);
    roomInput.addEventListener('input', () => {
      roomInput.value = roomInput.value.replace(/[^a-zA-Z0-9-_]/g, '').toUpperCase();
      updateButtons();
    });

    function enterRoom(name, room) {
      displayName = name;
      roomCode = room;
      localStorage.setItem('chatroom_name', displayName);
      localStorage.setItem('chatroom_room', roomCode);
      nameModal.classList.add('hidden');

      const badge = document.getElementById('room-badge');
      badge.classList.remove('hidden');
      if (roomCode === PUBLIC_ROOM) {
        badge.textContent = 'PUBLIC';
        badge.className = 'text-[10px] font-mono px-2 py-0.5 rounded-full uppercase tracking-wider bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300';
        shareBtn.classList.add('hidden');
      } else {
        badge.textContent = roomCode;
        badge.className = 'text-[10px] font-mono px-2 py-0.5 rounded-full uppercase tracking-wider bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300';
        shareBtn.classList.remove('hidden');
      }
      initChat();
    }

    if (displayName && roomCode) {
      nameModal.classList.add('hidden');
      const badge = document.getElementById('room-badge');
      badge.classList.remove('hidden');
      if (roomCode === PUBLIC_ROOM) {
        badge.textContent = 'PUBLIC';
        badge.className = 'text-[10px] font-mono px-2 py-0.5 rounded-full uppercase tracking-wider bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300';
        shareBtn.classList.add('hidden');
      } else {
        badge.textContent = roomCode;
        badge.className = 'text-[10px] font-mono px-2 py-0.5 rounded-full uppercase tracking-wider bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300';
        shareBtn.classList.remove('hidden');
      }
    } else {
      const params = new URLSearchParams(window.location.search);
      const inviteRoom = (params.get('room') || '').toUpperCase().replace(/[^A-Z0-9-_]/g, '');
      if (inviteRoom && inviteRoom.length >= 3 && inviteRoom !== 'PUBLIC') {
        roomInput.value = inviteRoom;
      }
      setTimeout(() => nameInput.focus(), 80);
    }

    joinPublic.addEventListener('click', () => {
      const name = nameInput.value.trim();
      if (name.length < 2) return;
      enterRoom(name, PUBLIC_ROOM);
    });

    joinPrivate.addEventListener('click', () => {
      const name = nameInput.value.trim();
      const room = roomInput.value.trim().toUpperCase();
      if (name.length < 2 || room.length < 3) return;
      if (room === PUBLIC_ROOM) {
        alert('This code is reserved for the public room. Choose a different code.');
        return;
      }
      enterRoom(name, room);
    });

    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') roomInput.focus(); });
    roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinPrivate.click(); });

    document.getElementById('leave-btn').addEventListener('click', () => {
      localStorage.removeItem('chatroom_room');
      localStorage.removeItem('chatroom_name');
      const url = new URL(window.location);
      url.searchParams.delete('room');
      window.history.replaceState({}, '', url);
      location.reload();
    });

    const shareModal = document.getElementById('share-modal');
    const shareLinkInput = document.getElementById('share-link-input');
    const copyLinkBtn = document.getElementById('copy-link-btn');
    const closeShare = document.getElementById('close-share');
    const shareWhatsapp = document.getElementById('share-whatsapp');
    const shareTelegram = document.getElementById('share-telegram');

    function getShareUrl() {
      const url = new URL(window.location.origin + window.location.pathname);
      url.searchParams.set('room', roomCode);
      return url.toString();
    }

    function openShareModal() {
      if (!roomCode || roomCode === PUBLIC_ROOM) return;
      const link = getShareUrl();
      shareLinkInput.value = link;
      const text = encodeURIComponent('Join my private chat room! ' + link);
      shareWhatsapp.href = 'https://wa.me/?text=' + text;
      shareTelegram.href = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent('Join my private chat room!');
      shareModal.classList.remove('hidden');
    }

    shareBtn.addEventListener('click', openShareModal);
    closeShare.addEventListener('click', () => shareModal.classList.add('hidden'));
    shareModal.addEventListener('click', e => { if (e.target === shareModal) shareModal.classList.add('hidden'); });

    copyLinkBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shareLinkInput.value);
        copyLinkBtn.textContent = 'Copied!';
        setTimeout(() => { copyLinkBtn.textContent = 'Copy'; }, 1500);
      } catch {
        shareLinkInput.select();
        document.execCommand('copy');
        copyLinkBtn.textContent = 'Copied!';
        setTimeout(() => { copyLinkBtn.textContent = 'Copy'; }, 1500);
      }
    });

    function relativeTime(iso) {
      const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (sec < 10) return 'just now';
      if (sec < 60) return sec + 's ago';
      if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
      if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
      return new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' });
    }
    setInterval(() => {
      document.querySelectorAll('[data-timestamp]').forEach(el => {
        el.textContent = relativeTime(el.dataset.timestamp);
      });
    }, 30000);

    const emojiPicker = document.getElementById('emoji-picker');
    const emojiBtn = document.getElementById('emoji-btn');
    const emojiGrid = emojiPicker.querySelector('div');
    EMOJIS.forEach(emoji => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'emoji-btn w-8 h-8 flex items-center justify-center text-xl rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition';
      btn.textContent = emoji;
      btn.addEventListener('click', () => {
        const input = document.getElementById('message-input');
        const start = input.selectionStart, end = input.selectionEnd;
        input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
        input.focus();
        input.selectionStart = input.selectionEnd = start + emoji.length;
        emojiPicker.classList.add('hidden');
        broadcastTyping();
      });
      emojiGrid.appendChild(btn);
    });
    emojiBtn.addEventListener('click', e => { e.stopPropagation(); emojiPicker.classList.toggle('hidden'); });
    document.addEventListener('click', e => {
      if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) emojiPicker.classList.add('hidden');
    });

    function canSendMessage(content) {
      const remaining = RATE_LIMIT_MS - (Date.now() - lastSentAt);
      if (remaining > 0) {
        const msg = document.getElementById('rate-limit-msg');
        msg.textContent = 'Please wait ' + (remaining / 1000).toFixed(1) + 's before sending again';
        msg.classList.remove('hidden');
        setTimeout(() => msg.classList.add('hidden'), remaining);
        return false;
      }
      if (content.length > MAX_MESSAGE_LENGTH) { alert('Message too long'); return false; }
      if (SPAM_PHRASES.some(p => content.toLowerCase().includes(p))) { alert('Message blocked by spam filter'); return false; }
      return true;
    }

    function initSupabase() {
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    async function loadMessages() {
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .eq('room_code', roomCode)
        .order('created_at', { ascending: true })
        .limit(150);
      if (error) { console.error(error); return; }
      messages = data || [];
      renderMessages();
    }

    function subscribeToMessages() {
      if (messagesChannel) supabaseClient.removeChannel(messagesChannel);
      messagesChannel = supabaseClient.channel('room-msgs:' + roomCode)
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'messages',
          filter: 'room_code=eq.' + roomCode
        }, payload => {
          const newMsg = payload.new;
          if (!messages.find(m => m.id === newMsg.id)) {
            messages.push(newMsg);
            appendMessage(newMsg);
            scrollToBottom();
          }
        }).subscribe();
    }

    function setupPresenceAndTyping() {
      if (presenceChannel) supabaseClient.removeChannel(presenceChannel);
      presenceChannel = supabaseClient.channel('room:' + roomCode, {
        config: { presence: { key: displayName } }
      });
      presenceChannel
        .on('presence', { event: 'sync' }, () => {
          onlineUsers = {};
          Object.values(presenceChannel.presenceState()).forEach(presences => {
            presences.forEach(p => { if (p.user) onlineUsers[p.user] = true; });
          });
          onlineUsers[displayName] = true;
          updateOnlineCount();
        })
        .on('presence', { event: 'join' }, ({ newPresences }) => {
          newPresences.forEach(p => { if (p.user) onlineUsers[p.user] = true; });
          onlineUsers[displayName] = true;
          updateOnlineCount();
        })
        .on('presence', { event: 'leave' }, ({ leftPresences }) => {
          leftPresences.forEach(p => { if (p.user && p.user !== displayName) delete onlineUsers[p.user]; });
          updateOnlineCount();
        })
        .on('broadcast', { event: 'typing' }, ({ payload }) => {
          if (payload.user === displayName) return;
          showTyping(payload.user);
        })
        .subscribe(async status => {
          if (status === 'SUBSCRIBED') {
            await presenceChannel.track({ user: displayName, online_at: new Date().toISOString() });
            onlineUsers[displayName] = true;
            updateOnlineCount();
          }
        });
    }

    function updateOnlineCount() {
      const names = Object.keys(onlineUsers);
      document.getElementById('online-number').textContent = names.length;
      const list = document.getElementById('online-list');
      if (names.length === 0) {
        list.innerHTML = '<p class="px-3 py-2 text-xs text-gray-400">No one else is here yet</p>';
      } else {
        list.innerHTML = names.map(name => {
          const isMe = name === displayName;
          return '<div class="flex items-center gap-2.5 px-3 py-2 hover:bg-gray-50 dark:hover:bg-gray-800/60"><span class="w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0"></span><span class="text-sm truncate ' + (isMe ? 'font-medium text-indigo-600 dark:text-indigo-400' : '') + '">' + escapeHtml(name) + (isMe ? ' (you)' : '') + '</span></div>';
        }).join('');
      }
    }

    const onlineBtn = document.getElementById('online-btn');
    const onlineDropdown = document.getElementById('online-dropdown');
    onlineBtn.addEventListener('click', e => {
      e.stopPropagation();
      onlineDropdown.classList.toggle('hidden');
      emojiPicker.classList.add('hidden');
    });
    document.addEventListener('click', e => {
      if (!onlineDropdown.contains(e.target) && e.target !== onlineBtn && !onlineBtn.contains(e.target)) {
        onlineDropdown.classList.add('hidden');
      }
    });

    function showTyping(user) {
      typingUsers.add(user);
      const text = [...typingUsers].slice(0, 3).join(', ') + (typingUsers.size > 3 ? '…' : '');
      document.getElementById('typing-text').textContent = typingUsers.size === 1 ? text + ' is typing…' : text + ' are typing…';
      document.getElementById('typing-indicator').classList.remove('hidden');
      clearTimeout(hideTypingTimer);
      hideTypingTimer = setTimeout(() => {
        typingUsers.clear();
        document.getElementById('typing-indicator').classList.add('hidden');
      }, 2500);
    }

    function broadcastTyping() {
      if (!presenceChannel) return;
      presenceChannel.send({ type: 'broadcast', event: 'typing', payload: { user: displayName } });
    }

    async function sendMessage(content) {
      content = content.trim();
      if (!content || !displayName || !roomCode) return;
      if (!canSendMessage(content)) return;
      lastSentAt = Date.now();
      const { error } = await supabaseClient.from('messages').insert({
        username: displayName,
        content,
        room_code: roomCode
      });
      if (error) {
        console.error(error);
        alert('Failed to send. Make sure the messages table has a room_code column.');
      }
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    function createMessageElement(msg) {
      const isMine = msg.username === displayName;
      const div = document.createElement('div');
      div.className = 'flex ' + (isMine ? 'justify-end' : 'justify-start') + ' animate-fade-in-up';
      div.innerHTML = '<div class="max-w-[80%] sm:max-w-[70%]"><div class="flex items-baseline gap-2 mb-0.5 ' + (isMine ? 'justify-end' : '') + '"><span class="text-xs font-medium ' + (isMine ? 'text-indigo-600 dark:text-indigo-400' : 'text-gray-500 dark:text-gray-400') + '">' + escapeHtml(msg.username) + '</span><span class="text-[10px] text-gray-400 dark:text-gray-500" data-timestamp="' + msg.created_at + '">' + relativeTime(msg.created_at) + '</span></div><div class="px-3.5 py-2 rounded-2xl text-sm leading-relaxed break-words ' + (isMine ? 'bg-indigo-600 text-white rounded-br-md' : 'bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-bl-md shadow-sm') + '">' + escapeHtml(msg.content) + '</div></div>';
      return div;
    }

    function renderMessages() {
      const container = document.getElementById('messages');
      const empty = document.getElementById('empty-state');
      Array.from(container.children).forEach(el => { if (el.id !== 'empty-state') el.remove(); });
      if (messages.length === 0) { empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      messages.forEach(msg => container.appendChild(createMessageElement(msg)));
      scrollToBottom();
    }

    function appendMessage(msg) {
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('messages').appendChild(createMessageElement(msg));
    }

    function scrollToBottom() {
      const c = document.getElementById('messages');
      requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; });
    }

    document.getElementById('message-form').addEventListener('submit', async e => {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;
      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;
      await sendMessage(text);
      input.value = '';
      sendBtn.disabled = false;
      input.focus();
      emojiPicker.classList.add('hidden');
    });

    document.getElementById('message-input').addEventListener('input', () => {
      if (document.getElementById('message-input').value.trim()) broadcastTyping();
    });

    function initChat() {
      supabaseClient = initSupabase();
      loadMessages();
      subscribeToMessages();
      setupPresenceAndTyping();
    }

    initTheme();
    if (displayName && roomCode) initChat();
  </script>
</body>
</html>
