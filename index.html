<body class="h-full overflow-hidden select-none">

</div>

</div>

</div>
</div>

<div class="flex gap-2"><button id="design-form-cancel" class="flex-1 py-2.5 rounded-xl text-sm text-zinc-400 border border-zinc-800">Cancel</button><button id="design-form-submit" class="flex-1 py-2.5 rounded-xl bg-white text-black text-sm font-semibold">Create & Send</button></div>

</div>
<div id="share-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-5">
<div class="w-full max-w-sm bg-zinc-900 rounded-2xl border border-zinc-800 p-5 space-y-4">

<div class="flex gap-2"><input id="share-link-input" type="text" readonly class="flex-1 px-3 py-2.5 rounded-xl bg-zinc-800 border border-zinc-700 text-sm"/><button id="copy-link-btn" class="px-4 py-2.5 rounded-xl bg-white text-black text-sm font-semibold">Copy</button></div>
<div class="grid grid-cols-2 gap-2"><a id="share-whatsapp" target="_blank" rel="noopener" class="py-2.5 rounded-xl bg-emerald-600 text-white text-sm text-center">WhatsApp</a><a id="share-telegram" target="_blank" rel="noopener" class="py-2.5 rounded-xl bg-sky-600 text-white text-sm text-center">Telegram</a></div>
<button id="close-share" class="w-full py-2.5 text-sm text-zinc-400">Close</button>
</div>
</div>
<script>
const SUPABASE_URL='https://vwpvbhuqvxmshkktqncp.supabase.co',SUPABASE_ANON_KEY='sb_publishable_zGlQFEHSb-H1KblpZ6AfVQ_Vn8x1ozE',PUBLIC_ROOM='PUBLIC',RATE_LIMIT_MS=1800;
let supabaseClient=null,displayName=localStorage.getItem('chatroom_name')||'',roomCode=localStorage.getItem('chatroom_room')||'',messages=[],lastSentAt=0,presenceChannel=null,messagesChannel=null,onlineUsers={},typingUsers=new Set(),hideTypingTimer=null;
const EMOJIS=['😀','😂','😍','🥰','😎','😢','😡','🙌','👍','🔥','✨','💯','🎉','❤️','🚀','💬'];
const welcomeScreen=document.getElementById('welcome-screen'),joinScreen=document.getElementById('join-screen'),app=document.getElementById('app'),nameInput=document.getElementById('name-input'),roomInput=document.getElementById('room-input'),joinPublic=document.getElementById('join-public'),joinPrivate=document.getElementById('join-private'),shareBtn=document.getElementById('share-btn'),messageInput=document.getElementById('message-input'),sendBtn=document.getElementById('send-btn'),idleIcons=document.getElementById('idle-icons');
document.getElementById('welcome-next').onclick=()=>{welcomeScreen.classList.add('hidden');joinScreen.classList.remove('hidden');setTimeout(()=>nameInput.focus(),100)};
document.getElementById('back-to-welcome').onclick=()=>{joinScreen.classList.add('hidden');welcomeScreen.classList.remove('hidden')};
function updateButtons(){const n=nameInput.value.trim().length>=2;joinPublic.disabled=!n;joinPrivate.disabled=!n||roomInput.value.trim().length<3}
nameInput.oninput=updateButtons;roomInput.oninput=()=>{roomInput.value=roomInput.value.replace(/[^a-zA-Z0-9-_]/g,'').toUpperCase();updateButtons()};
function avatarColor(n){const c=['#E1306C','#833AB4','#405DE6','#3797F0','#22C55E','#F59E0B'];let h=0;for(let i=0;i<(n||'').length;i++)h=n.charCodeAt(i)+((h<<5)-h);return c[Math.abs(h)%c.length]}
function initials(n){return (n||'?').slice(0,2).toUpperCase()}
function enterRoom(name,room){displayName=name;roomCode=room;localStorage.setItem('chatroom_name',name);localStorage.setItem('chatroom_room',room);welcomeScreen.classList.add('hidden');joinScreen.classList.add('hidden');app.classList.remove('hidden');const t=room===PUBLIC_ROOM?'Open Room':room;document.getElementById('room-title').textContent=t;const av=document.getElementById('room-avatar');av.textContent=initials(t);av.style.background=avatarColor(t);shareBtn.classList.toggle('hidden',room===PUBLIC_ROOM);initChat()}
if(displayName&&roomCode)enterRoom(displayName,roomCode);else{const p=new URLSearchParams(location.search);const ir=(p.get('room')||'').toUpperCase().replace(/[^A-Z0-9-_]/g,'');if(ir&&ir.length>=3&&ir!=='PUBLIC'){welcomeScreen.classList.add('hidden');joinScreen.classList.remove('hidden');roomInput.value=ir}}
joinPublic.onclick=()=>{const n=nameInput.value.trim();if(n.length>=2)enterRoom(n,PUBLIC_ROOM)};
joinPrivate.onclick=()=>{const n=nameInput.value.trim(),r=roomInput.value.trim().toUpperCase();if(n.length>=2&&r.length>=3&&r!==PUBLIC_ROOM)enterRoom(n,r)};
document.getElementById('leave-btn').onclick=()=>{localStorage.removeItem('chatroom_room');localStorage.removeItem('chatroom_name');location.href=location.pathname};
const shareModal=document.getElementById('share-modal');
shareBtn.onclick=()=>{if(!roomCode||roomCode===PUBLIC_ROOM)return;const link=new URL(location.origin+location.pathname);link.searchParams.set('room',roomCode);document.getElementById('share-link-input').value=link;document.getElementById('share-whatsapp').href='https://wa.me/?text='+encodeURIComponent('Join my chat! '+link);document.getElementById('share-telegram').href='https://t.me/share/url?url='+encodeURIComponent(link);shareModal.classList.remove('hidden')};
document.getElementById('close-share').onclick=()=>shareModal.classList.add('hidden');
document.getElementById('copy-link-btn').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('share-link-input').value);document.getElementById('copy-link-btn').textContent='Copied!'}catch{}};
messageInput.oninput=()=>{const h=messageInput.value.trim().length>0;sendBtn.classList.toggle('hidden',!h);idleIcons.classList.toggle('hidden',h);if(h)broadcastTyping()};
const emojiPicker=document.getElementById('emoji-picker'),emojiGrid=emojiPicker.querySelector('div');
EMOJIS.forEach(e=>{const b=document.createElement('button');b.type='button';b.className='w-9 h-9 text-xl';b.textContent=e;b.onclick=()=>{messageInput.value+=e;messageInput.dispatchEvent(new Event('input'));emojiPicker.classList.add('hidden')};emojiGrid.appendChild(b)});
document.getElementById('emoji-btn').onclick=e=>{e.stopPropagation();emojiPicker.classList.toggle('hidden')};
const canvaModal=document.getElementById('canva-modal'),designFormModal=document.getElementById('design-form-modal');let designFormMode='quote';
document.getElementById('canva-btn').onclick=e=>{e.stopPropagation();canvaModal.classList.remove('hidden')};
document.getElementById('close-canva').onclick=()=>canvaModal.classList.add('hidden');
document.getElementById('canva-blank').onclick=()=>{canvaModal.classList.add('hidden');window.open('https://www.canva.com/create','_blank')};
function openDesignForm(mode){designFormMode=mode;canvaModal.classList.add('hidden');document.getElementById('design-form-title').textContent=mode==='quote'?'Create Quote Card':'Create Announcement';document.getElementById('design-form-text').value='';document.getElementById('design-form-author').value=displayName||'';designFormModal.classList.remove('hidden')}
document.getElementById('canva-quote').onclick=()=>openDesignForm('quote');
document.getElementById('canva-announce').onclick=()=>openDesignForm('announce');
document.getElementById('design-form-cancel').onclick=()=>designFormModal.classList.add('hidden');
document.getElementById('design-form-submit').onclick=async()=>{const text=document.getElementById('design-form-text').value.trim();const author=document.getElementById('design-form-author').value.trim()||displayName;if(!text)return;designFormModal.classList.add('hidden');const payload=designFormMode==='quote'?`[CANVA_QUOTE]${JSON.stringify({text,author})}[/CANVA_QUOTE]`:`[CANVA_ANNOUNCE]${JSON.stringify({text,author})}[/CANVA_ANNOUNCE]`;await sendMessage(payload)};
function handleCanvaCommand(raw){const t=raw.trim(),l=t.toLowerCase();if(l==='/canva'||l==='/design'){canvaModal.classList.remove('hidden');return true}if(l.startsWith('@canva search ')||l.startsWith('/canva search ')){const q=t.replace(/^@?canva search /i,'').trim()||'templates';window.open('https://www.canva.com/templates/?query='+encodeURIComponent(q),'_blank');return true}if(l.startsWith('@canva')){window.open('https://www.canva.com/','_blank');return true}return false}
function parseSpecialContent(content){const qm=content.match(/^\[CANVA_QUOTE\]([\s\S]*?)\[\/CANVA_QUOTE\]$/);if(qm){try{return{type:'quote',data:JSON.parse(qm[1])}}catch{}}const am=content.match(/^\[CANVA_ANNOUNCE\]([\s\S]*?)\[\/CANVA_ANNOUNCE\]$/);if(am){try{return{type:'announce',data:JSON.parse(am[1])}}catch{}}if(/canva\.com\/(design|brand)\//i.test(content))return{type:'canva_link',data:{url:content.trim()}};return null}
function renderDesignCard(s){if(s.type==='quote'){const{text,author}=s.data;return`<div class="quote-card-bg rounded-2xl border border-zinc-700 overflow-hidden max-w-[280px]"><div class="p-5 space-y-2"><div class="text-2xl text-pink-400">“</div><p class="text-[15px] text-zinc-100 font-medium">${escapeHtml(text)}</p><p class="text-xs text-zinc-400">— ${escapeHtml(author||'')}</p></div><div class="px-4 py-2 border-t border-zinc-700/50 flex justify-between"><span class="text-[10px] text-zinc-500">✨ Quote</span><a href="https://www.canva.com/create/instagram-posts/" target="_blank" class="text-[11px] text-[#3797F0]">Edit in Canva</a></div></div>`}if(s.type==='announce'){const{text,author}=s.data;return`<div class="announce-card-bg rounded-2xl border border-sky-800/50 overflow-hidden max-w-[280px]"><div class="p-4 space-y-2"><div class="text-xs text-sky-300 font-semibold">📢 ANNOUNCEMENT</div><p class="text-[15px] text-white font-medium">${escapeHtml(text)}</p><p class="text-[11px] text-sky-200/60">from ${escapeHtml(author||'')}</p></div><div class="px-4 py-2 border-t border-sky-900/50"><a href="https://www.canva.com/create/posters/" target="_blank" class="text-[11px] text-sky-400">Open Canva</a></div></div>`}if(s.type==='canva_link')return`<div class="rounded-2xl border border-zinc-700 p-4 max-w-[280px]"><div class="font-medium text-sm mb-2">🎨 Canva Design</div><a href="${escapeHtml(s.data.url)}" target="_blank" class="block text-center py-2 rounded-xl bg-white text-black text-xs font-semibold">Open in Canva</a></div>`;return null}
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function formatDivider(iso){const d=new Date(iso),now=new Date();if(d.toDateString()===now.toDateString())return'Today '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});return d.toLocaleDateString([],{month:'short',day:'numeric'})}
async function sendMessage(content){content=content.trim();if(!content||!displayName||!roomCode)return;if(Date.now()-lastSentAt<RATE_LIMIT_MS)return;lastSentAt=Date.now();await supabaseClient.from('messages').insert({username:displayName,content,room_code:roomCode})}
function createMessageElement(msg,prev,next){const isMine=msg.username===displayName;const samePrev=prev&&prev.username===msg.username;const sameNext=next&&next.username===msg.username;const row=document.createElement('div');row.className='w-full flex '+(isMine?'justify-end':'justify-start')+' animate-fade-in';row.style.marginTop=samePrev?'2px':'8px';let av='';if(!isMine)av=!sameNext?`<div class="w-7 h-7 rounded-full flex items-center justify-center text-[10px] text-white self-end" style="background:${avatarColor(msg.username)}">${initials(msg.username)}</div>`:`<div class="w-7 h-7"></div>`;let name=!isMine&&!samePrev?`<div class="text-[11px] text-zinc-500 mb-0.5 ml-1">${escapeHtml(msg.username)}</div>`:'';const special=parseSpecialContent(msg.content);let body='';if(special)body=renderDesignCard(special);if(!body){const r='rounded-3xl';const bc=isMine?`bubble-out text-white ${r} px-3.5 py-2 text-[15px]`:`bg-zinc-800 text-zinc-100 ${r} px-3.5 py-2 text-[15px]`;body=`<div class="${bc}">${escapeHtml(msg.content)}</div>`}row.innerHTML=`<div class="flex items-end gap-1.5 ${isMine?'flex-row-reverse':''}" style="max-width:90%">${av}<div class="flex flex-col ${isMine?'items-end':'items-start'}">${name}${body}</div></div>`;return row}
function renderMessages(){const c=document.getElementById('messages'),empty=document.getElementById('empty-state');[...c.children].forEach(el=>{if(el.id!=='empty-state')el.remove()});if(!messages.length){empty.classList.remove('hidden');return}empty.classList.add('hidden');let last='';messages.forEach((m,i)=>{const day=new Date(m.created_at).toDateString();if(day!==last){last=day;const d=document.createElement('div');d.className='w-full flex justify-center my-3';d.innerHTML=`<span class="text-[11px] text-zinc-500">${formatDivider(m.created_at)}</span>`;c.appendChild(d)}c.appendChild(createMessageElement(m,messages[i-1],messages[i+1]))});c.scrollTop=c.scrollHeight}
function appendMessage(msg){document.getElementById('empty-state').classList.add('hidden');document.getElementById('messages').appendChild(createMessageElement(msg,messages[messages.length-2],null));document.getElementById('messages').scrollTop=99999}
async function loadMessages(){const{data}=await supabaseClient.from('messages').select('*').eq('room_code',roomCode).order('created_at',{ascending:true}).limit(150);messages=data||[];renderMessages()}
function subscribeToMessages(){if(messagesChannel)supabaseClient.removeChannel(messagesChannel);messagesChannel=supabaseClient.channel('room-msgs:'+roomCode).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room_code=eq.'+roomCode},p=>{if(!messages.find(m=>m.id===p.new.id)){messages.push(p.new);appendMessage(p.new)}}).subscribe()}
function setupPresence(){if(presenceChannel)supabaseClient.removeChannel(presenceChannel);presenceChannel=supabaseClient.channel('room:'+roomCode,{config:{presence:{key:displayName}}}).on('presence',{event:'sync'},()=>{onlineUsers={};Object.values(presenceChannel.presenceState()).forEach(ps=>ps.forEach(p=>{if(p.user)onlineUsers[p.user]=true}));onlineUsers[displayName]=true;const n=Object.keys(onlineUsers).length;document.getElementById('room-status').textContent=n<=1?'Active now':n+' active now'}).on('broadcast',{event:'typing'},({payload})=>{if(payload.user===displayName)return;document.getElementById('typing-indicator').classList.remove('hidden');clearTimeout(hideTypingTimer);hideTypingTimer=setTimeout(()=>document.getElementById('typing-indicator').classList.add('hidden'),2500)}).subscribe(async s=>{if(s==='SUBSCRIBED')await presenceChannel.track({user:displayName})})}
function broadcastTyping(){presenceChannel&&presenceChannel.send({type:'broadcast',event:'typing',payload:{user:displayName}})}
document.getElementById('message-form').onsubmit=async e=>{e.preventDefault();const text=messageInput.value.trim();if(!text)return;if(handleCanvaCommand(text)){messageInput.value='';messageInput.dispatchEvent(new Event('input'));return}await sendMessage(text);messageInput.value='';messageInput.dispatchEvent(new Event('input'))};
function initChat(){supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);loadMessages();subscribeToMessages();setupPresence()}
</script>
